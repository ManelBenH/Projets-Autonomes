<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibliothéque</title>
    <link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Birthstone+Bounce:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="bg-mesh">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <a  href="" class="logo">Bibliothéque numérique</a>
        <nav>
            <a href="">Livres</a>
            <a href="">ebooks</a>
            <a href="">BD</a>
        </nav>
    </header>
    <main class="container">
        
        <section class="a1">

            <h1>Votre guide  littéraire</h1>
            <p>Découvrez des milliers de livres, ebooks et bandes dessinées. Fiches complètes et avis.</p>
            <input type="text" placeholder="un titre, un auteur, un éditeur, un théme...">
            <button id="search-btn" class="search-btn"> Rechercher</button>

        </section>
        


        <section class="popular-books books">
            <div class="demi-cercle">
                <h2>Livres populaires</h2>

            </div>

           <div id="popular-books-container" class="books-container">
                

           </div>

           <!-- <button class="btn-popular-books">voir tous les livres</button> -->

       </section>

        <section class="a2">
            <div class="titre">
                <h2>Parcourir par genre</h2>
            </div>
            <div class="genre">
                <a href="" class="genre-link" data-category="art">
                    <i></i>
                    <span>Art</span>
                </a>
                <a href="" class="genre-link" data-category="biography">
                    <i></i>
                    <span>Biographie</span>
                </a>
                <a href="" class="genre-link" data-category="fiction">
                    <i></i>
                    <span>Fiction</span>
                </a>
                <a href="" class="genre-link" data-category="jeunesse">
                    <i></i>
                    <span>Jeunesse</span>
                </a>
                <a href="" class="genre-link" data-category="education">
                    <i></i>
                    <span>Éducation</span>
                </a>
                <a href="" class="genre-link" data-category="manga">
                    <i></i>
                    <span>Manga</span>
                </a>
                <a href="" class="genre-link" data-category="comic">
                    <i></i>
                    <span>Bande dessinée</span>
                </a>
                <a href="" class="genre-link" data-category="history">
                    <i></i>
                    <span>Histoire</span>
                </a>
                
        

            </div>


        </section>

    </main>
    <script src="app.js" defer></script>
</body>
</html>
